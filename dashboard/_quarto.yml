project:
  type: website
  output-dir: docs

# The site title, URL, repository and footer come from the challenge config:
# `Rscript inst/scripts/dashboard.R stage` writes them to _challenge.yml.
metadata-files:
  - _challenge.yml

website:
  page-navigation: true
  repo-actions: [source, issue]

  navbar:
    background: primary
    search: true
    left:
      - href: targets.qmd
        icon: bullseye
      - href: instructions.qmd
        icon: info-square
      - href: performance.qmd
        icon: droplet
      - href: catalog.qmd
        icon: book
      - href: learn-more.qmd
        icon: check2-circle
      - href: use-in-course.qmd
        icon: people

format:
  html:
    theme: sandstone
    css: styles.css
    title-block-style: default
    title-block-banner: "img/banner.jpg"
    title-block-banner-color: white
    page-layout: full
    toc: true

editor: visual

