on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

name: catalog

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  build_catalog:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Two runs would push competing commits to the catalog repository.
    concurrency:
      group: catalog
      cancel-in-progress: false
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      EXTERNAL_GH_PAT: ${{ secrets.CATALOG_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    container:
      image: ${{ needs.config.outputs.image }}
      options: --memory 15120m
    steps:
      - run: git config --system --add safe.directory '*'

      - name: checkout source repository
        uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge

      # The catalog is written to ../<catalog_config$catalog_path>, a clone of
      # catalog_config$catalog_repo.
      - name: clone catalog destination repository
        run: |
          repo=$(Rscript -e 'cat(yaml::read_yaml("challenge_configuration.yaml")$catalog_config$catalog_repo)')
          dir=$(Rscript -e 'cat(yaml::read_yaml("challenge_configuration.yaml")$catalog_config$catalog_path)')
          git clone --depth 1 "https://github.com/${repo}.git" "../${dir}"
          echo "CATALOG_REPO=${repo}" >> "$GITHUB_ENV"
          echo "CATALOG_DIR=../${dir}" >> "$GITHUB_ENV"

      - name: Build catalog and model metadata
        run: Rscript inst/scripts/catalog.R

      - name: Commit and Push
        run: |
          cd "$CATALOG_DIR"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "update catalog" || echo "nothing to commit"
          git pull --rebase
          git push "https://${EXTERNAL_GH_PAT}:${EXTERNAL_GH_PAT}@github.com/${CATALOG_REPO}"

      - uses: ./.github/actions/healthcheck
        with:
          name: catalog
