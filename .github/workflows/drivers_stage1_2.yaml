# Download today's GEFS forecasts (stage 1) and interpolate them to hourly
# (stage 2).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

name: drivers-stage1-2

concurrency:
  group: drivers-stage1-2
  cancel-in-progress: false

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  drivers:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge

      # arrow 20.0.0, gdalcubes and gefs4cast are installed in the image.
      - name: Download GEFS and generate stage 2
        run: Rscript inst/scripts/drivers_stage1_2.R

      - uses: ./.github/actions/healthcheck
        with:
          name: drivers-stage1-2
