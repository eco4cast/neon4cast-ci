# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:


name: baseline-daily-forecasts

jobs:
  terrestrial:
    runs-on: ubuntu-latest
    container: eco4cast/rocker-neon4cast:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The key that has always uploaded baseline forecasts, under the names the
      # config's `credentials$submissions` expects.
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Generate forecasts
        run: Rscript inst/scripts/baselines.R daily Terrestrial

  aquatics:
    runs-on: ubuntu-latest
    container: eco4cast/rocker-neon4cast:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The key that has always uploaded baseline forecasts, under the names the
      # config's `credentials$submissions` expects.
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Generate forecasts
        run: Rscript inst/scripts/baselines.R daily Aquatics

  phenology:
    runs-on: ubuntu-latest
    container: eco4cast/rocker-neon4cast:latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # The key that has always uploaded baseline forecasts, under the names the
      # config's `credentials$submissions` expects.
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Generate forecasts
        run: Rscript inst/scripts/baselines.R daily Phenology

      - name: Healthcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y curl
          curl -m 10 --retry 5 https://hc-ping.com/5e8257df-e494-4946-8aee-1f78eba0d5b7
