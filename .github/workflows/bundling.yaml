# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

name: bundling

# Never run two bundlers at once: both would read the same bundle and raw files,
# and one would overwrite the other's upload. Queue instead of cancelling, so a
# long backlog run is never killed midway.
concurrency:
  group: bundling
  cancel-in-progress: false

jobs:
  forecasts:
    runs-on: ubuntu-latest #efi-cirrus
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
    container: eco4cast/rocker-neon4cast:latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Bundle forecasts
        run: r submission_processing/bundled_forecasts.R

      - name: Bundle summaries
        run: r submission_processing/bundled_summaries.R


