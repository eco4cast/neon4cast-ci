# Download and clean each target group's observations and publish its targets
# file. One job per target group with a `targets_script` in the config; a group
# with `targets_large_runner: true` runs on ci$large_runner.
on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

name: target-generation

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  targets:
    needs: config
    name: ${{ matrix.group }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.config.outputs.targets) }}
    runs-on: ${{ matrix.large && needs.config.outputs.large_runner || 'ubuntu-latest' }}
    timeout-minutes: ${{ matrix.large && 720 || 360 }}
    # A group's runs share its caches (e.g. the terrestrial neonstore db and
    # flux archive on OSN); never run two at once.
    concurrency:
      group: targets-${{ matrix.group }}
      cancel-in-progress: false
    container:
      image: ${{ needs.config.outputs.image }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OSN_KEY: ${{ secrets.OSN_KEY }}
      OSN_SECRET: ${{ secrets.OSN_SECRET }}
      NEON_TOKEN: ${{ secrets.NEON_TOKEN }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-challenge
        with:
          refresh-ca: 'true'

      - name: Generate targets
        run: Rscript ${{ matrix.script }}

      - uses: ./.github/actions/healthcheck
        with:
          name: targets-${{ matrix.group }}

  # Pings only when every group succeeded.
  healthcheck:
    needs: [config, targets]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ${{ needs.config.outputs.image }}
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/healthcheck
        with:
          name: targets
