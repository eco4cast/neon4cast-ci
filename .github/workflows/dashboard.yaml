on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

name: dashboard

# Two runs would push competing commits to gh-pages.
concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  config:
    uses: ./.github/workflows/_config.yaml

  dashboard:
    needs: config
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    container:
      image: ${{ needs.config.outputs.image }}
    steps:
      - run: git config --system --add safe.directory '*'

      # Full history: the publish step checks out the gh-pages branch.
      - uses: actions/checkout@v6
        with:
           fetch-depth: 0
           set-safe-directory: '*'

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.4.146

      # Queries the public buckets; writes dashboard/data/ and the site
      # settings (title, links) in dashboard/_challenge.yml.
      - name: Stage data
        run: Rscript inst/scripts/dashboard.R

      # Also writes the sitemap, from the config's challenge_url.
      - name: Render
        run: quarto render dashboard

      - name: Publish
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout gh-pages
          cp -r dashboard/docs/* .
          git add .
          git commit -a -m "update pages" || echo "nothing to commit"
          git push https://${GITHUB_PAT}:${GITHUB_PAT}@github.com/${GITHUB_REPOSITORY}
          # Back to the code branch, for the healthcheck step.
          git checkout -

      - uses: ./.github/actions/healthcheck
        with:
          name: dashboard
