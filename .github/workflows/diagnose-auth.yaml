# TEMPORARY diagnostic - delete once the submissions auth question is settled.
on:
  workflow_dispatch:
  push:
    branches: [fix-mc-download]

name: diagnose-auth

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_SUBMISSIONS }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY_SUBMISSIONS }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
    container: eco4cast/rocker-neon4cast:latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Dry-run the new download path (no processing, no deletes)
        shell: Rscript {0}
        run: |
          library(minioclient)
          config <- yaml::read_yaml("challenge_configuration.yaml")
          mc_alias_set("submit", config$submissions_endpoint,
                       Sys.getenv("AWS_ACCESS_KEY_SUBMISSIONS"),
                       Sys.getenv("AWS_SECRET_ACCESS_KEY_SUBMISSIONS"))
          mc_alias_set("submit_read", config$submissions_endpoint, "", "")

          local_dir <- file.path(tempdir(), "submissions")
          fs::dir_create(local_dir)

          submission_keys <- mc_ls(paste0("submit/", config$submissions_bucket),
                                   recursive = TRUE, details = TRUE)$key
          failed <- character(0)
          t0 <- Sys.time()
          for (key in submission_keys) {
            dest <- file.path(local_dir, key)
            fs::dir_create(dirname(dest))
            copied <- tryCatch({ mc_cp(paste0("submit_read/", config$submissions_bucket, "/", key), dest); TRUE },
                               error = function(e) { warning("could not download ", key, ": ", conditionMessage(e), call. = FALSE); FALSE })
            if (!isTRUE(copied)) failed <- c(failed, key)
          }
          cat("listed :", length(submission_keys), "\n")
          cat("failed :", length(failed), "\n")
          cat("elapsed:", round(as.numeric(Sys.time() - t0, units = "secs"), 1), "sec\n")

          got <- fs::dir_ls(local_dir, recurse = TRUE, type = "file")
          cat("files on disk :", length(got), "\n")
          cat("total bytes   :", sum(fs::file_size(got)), "\n")
          cat("nested paths  :", sum(grepl("/", fs::path_rel(got, local_dir))), "\n")
          stopifnot(length(got) == length(submission_keys) - length(failed))
          cat("OK: every listed key that downloaded is present on disk\n")
