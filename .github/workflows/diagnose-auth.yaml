# TEMPORARY diagnostic - delete once the submissions auth question is settled.
on:
  workflow_dispatch:
  push:
    branches: [fix-mc-download]

name: diagnose-auth

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_SUBMISSIONS }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY_SUBMISSIONS }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
    container: eco4cast/rocker-neon4cast:latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Inspect submissions bucket layout
        shell: Rscript {0}
        run: |
          library(minioclient)
          ep <- yaml::read_yaml("challenge_configuration.yaml")$submissions_endpoint
          bkt <- yaml::read_yaml("challenge_configuration.yaml")$submissions_bucket
          mc_alias_set("submit", ep, Sys.getenv("EFI_NRP_KEY"), Sys.getenv("EFI_NRP_SECRET"))
          flat <- mc_ls(paste0("submit/", bkt))
          rec  <- mc_ls(paste0("submit/", bkt), recursive = TRUE, details = TRUE)
          cat("flat keys:", length(flat), " recursive rows:", nrow(rec), "\n")
          cat("any folders:", any(rec$is_folder), "\n")
          cat("any key containing '/':", any(grepl("/", rec$key)), "\n")
          cat("sample keys:\n"); print(utils::head(rec$key, 8))
