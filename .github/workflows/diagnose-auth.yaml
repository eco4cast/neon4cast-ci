# TEMPORARY diagnostic - delete once the submissions auth question is settled.
on:
  workflow_dispatch:
  push:
    branches: [fix-mc-download]

name: diagnose-auth

jobs:
  diag:
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_ACCESS_KEY_SUBMISSIONS }}
      AWS_SECRET_ACCESS_KEY_SUBMISSIONS: ${{ secrets.AWS_SECRET_ACCESS_KEY_SUBMISSIONS }}
      EFI_NRP_KEY: ${{ secrets.EFI_NRP_KEY }}
      EFI_NRP_SECRET: ${{ secrets.EFI_NRP_SECRET }}
    container: eco4cast/rocker-neon4cast:latest
    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/install-mc

      - name: Probe submissions bucket auth
        shell: bash
        run: |
          MC="$(Rscript --vanilla -e 'cat(getOption("minioclient.dir", tools::R_user_dir("minioclient", "data")))')/mc"
          EP=https://s3-west.nrp-nautilus.io
          set +e

          A=$(mktemp -d); N=$(mktemp -d)
          $MC --config-dir "$A" alias set auth "$EP" "$EFI_NRP_KEY" "$EFI_NRP_SECRET" >/dev/null 2>&1
          $MC --config-dir "$N" alias set anon "$EP" >/dev/null 2>&1

          echo "== 1. LIST with authenticated key =="
          $MC --config-dir "$A" ls auth/submissions --json 2>/tmp/e >/tmp/list.json
          echo "  rc=$? $(head -1 /tmp/e)"
          keys=$(sed -n 's/.*"key":"\([^"]*\)".*/\1/p' /tmp/list.json)
          echo "  objects listed: $(printf '%s\n' "$keys" | grep -c . )"

          echo
          echo "== 2. anonymous GET across a sample =="
          ok=0; bad=0
          for k in $(printf '%s\n' "$keys" | head -12); do
            $MC --config-dir "$N" cp "anon/submissions/$k" "$N/probe.bin" >/dev/null 2>/tmp/e
            if [ $? -eq 0 ]; then ok=$((ok+1)); else bad=$((bad+1)); echo "  FAILED: $k -> $(head -1 /tmp/e)"; fi
          done
          echo "  anonymous GET succeeded on $ok object(s), failed on $bad"

          echo
          echo "== 3. DELETE permission (non-existent key: mutates nothing) =="
          probe=".permcheck-does-not-exist-$RANDOM$RANDOM"
          $MC --config-dir "$A" rm "auth/submissions/$probe" >/tmp/o 2>/tmp/e
          echo "  authenticated rc=$? $(cat /tmp/o /tmp/e | head -1)"
          $MC --config-dir "$N" rm "anon/submissions/$probe" >/tmp/o 2>/tmp/e
          echo "  anonymous     rc=$? $(cat /tmp/o /tmp/e | head -1)"
          exit 0
