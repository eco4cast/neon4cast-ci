  # Catalog that lists this one as a child.
  parent_catalog_url: 'https://raw.githubusercontent.com/eco4cast/challenge-catalogs/main/catalog.json'
  # Descriptions of the site metadata columns, shown in the sites collection.
  site_columns_file: catalog/site_columns.csv
